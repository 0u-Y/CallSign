[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "contracts/out"
cache_path = "contracts/cache"
libs = ["node_modules"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read-write", path = "./artifacts" }]

remappings = ["@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/"]
