name: institutionproof

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: institutionproof
      POSTGRES_USER: institutionproof
      POSTGRES_PASSWORD: institutionproof_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U institutionproof -d institutionproof"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  besu1:
    image: hyperledger/besu:26.8.1
    restart: unless-stopped
    entrypoint: ["bash", "-lc"]
    command: ["exec besu --data-path=/var/lib/besu --genesis-file=/network/genesis.json --node-private-key-file=/network/keys/node1/key --network-id=20260914 --p2p-host=10.203.0.11 --p2p-port=30303 --bootnodes=enode://$$(sed 's/^0x//' /network/keys/node1/key.pub)@10.203.0.11:30303 --rpc-http-enabled=true --rpc-http-host=0.0.0.0 --rpc-http-port=8545 --rpc-http-api=ETH,NET,QBFT,WEB3 --host-allowlist=* --rpc-http-cors-origins=http://localhost:4173 --min-gas-price=0"]
    ports: ["127.0.0.1:18545:8545"]
    volumes:
      - ../../.local/besu:/network:ro
      - besu1-data:/var/lib/besu
    networks:
      ledger:
        ipv4_address: 10.203.0.11
    healthcheck: &besu-health
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8545'"]
      interval: 3s
      timeout: 2s
      retries: 20

  besu2:
    image: hyperledger/besu:26.8.1
    restart: unless-stopped
    entrypoint: ["bash", "-lc"]
    command: ["exec besu --data-path=/var/lib/besu --genesis-file=/network/genesis.json --node-private-key-file=/network/keys/node2/key --network-id=20260914 --p2p-host=10.203.0.12 --p2p-port=30303 --bootnodes=enode://$$(sed 's/^0x//' /network/keys/node1/key.pub)@10.203.0.11:30303 --rpc-http-enabled=true --rpc-http-host=0.0.0.0 --rpc-http-port=8545 --rpc-http-api=ETH,NET,QBFT,WEB3 --host-allowlist=* --min-gas-price=0"]
    ports: ["127.0.0.1:28545:8545"]
    volumes:
      - ../../.local/besu:/network:ro
      - besu2-data:/var/lib/besu
    networks:
      ledger:
        ipv4_address: 10.203.0.12
    depends_on: { besu1: { condition: service_healthy } }
    healthcheck: *besu-health

  besu3:
    image: hyperledger/besu:26.8.1
    restart: unless-stopped
    entrypoint: ["bash", "-lc"]
    command: ["exec besu --data-path=/var/lib/besu --genesis-file=/network/genesis.json --node-private-key-file=/network/keys/node3/key --network-id=20260914 --p2p-host=10.203.0.13 --p2p-port=30303 --bootnodes=enode://$$(sed 's/^0x//' /network/keys/node1/key.pub)@10.203.0.11:30303 --rpc-http-enabled=true --rpc-http-host=0.0.0.0 --rpc-http-port=8545 --rpc-http-api=ETH,NET,QBFT,WEB3 --host-allowlist=* --min-gas-price=0"]
    ports: ["127.0.0.1:38545:8545"]
    volumes:
      - ../../.local/besu:/network:ro
      - besu3-data:/var/lib/besu
    networks:
      ledger:
        ipv4_address: 10.203.0.13
    depends_on: { besu1: { condition: service_healthy } }
    healthcheck: *besu-health

  besu4:
    image: hyperledger/besu:26.8.1
    restart: unless-stopped
    entrypoint: ["bash", "-lc"]
    command: ["exec besu --data-path=/var/lib/besu --genesis-file=/network/genesis.json --node-private-key-file=/network/keys/node4/key --network-id=20260914 --p2p-host=10.203.0.14 --p2p-port=30303 --bootnodes=enode://$$(sed 's/^0x//' /network/keys/node1/key.pub)@10.203.0.11:30303 --rpc-http-enabled=true --rpc-http-host=0.0.0.0 --rpc-http-port=8545 --rpc-http-api=ETH,NET,QBFT,WEB3 --host-allowlist=* --min-gas-price=0"]
    ports: ["127.0.0.1:48545:8545"]
    volumes:
      - ../../.local/besu:/network:ro
      - besu4-data:/var/lib/besu
    networks:
      ledger:
        ipv4_address: 10.203.0.14
    depends_on: { besu1: { condition: service_healthy } }
    healthcheck: *besu-health

  witness1:
    build:
      context: ../..
      dockerfile: infra/compose/witness.Dockerfile
    environment:
      WITNESS_ID: witness-1
      WITNESS_PORT: 4201
      BESU_RPC_URL: http://besu1:8545
      WITNESS_KEY_PATH: /app/.local/witness-keys/witness-1.json
      WITNESS_PUBLIC_PATH: /app/.local/witness-public/witness-1.json
    ports: ["127.0.0.1:4201:4201"]
    volumes: ["../../.local:/app/.local"]
    networks: [ledger]
    depends_on: { besu1: { condition: service_healthy } }
    healthcheck: &witness-health
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.WITNESS_PORT + '/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 3s
      timeout: 2s
      retries: 30
    restart: unless-stopped

  witness2:
    build:
      context: ../..
      dockerfile: infra/compose/witness.Dockerfile
    environment:
      WITNESS_ID: witness-2
      WITNESS_PORT: 4202
      BESU_RPC_URL: http://besu2:8545
      WITNESS_KEY_PATH: /app/.local/witness-keys/witness-2.json
      WITNESS_PUBLIC_PATH: /app/.local/witness-public/witness-2.json
    ports: ["127.0.0.1:4202:4202"]
    volumes: ["../../.local:/app/.local"]
    networks: [ledger]
    depends_on: { besu2: { condition: service_healthy } }
    healthcheck: *witness-health
    restart: unless-stopped

  witness3:
    build:
      context: ../..
      dockerfile: infra/compose/witness.Dockerfile
    environment:
      WITNESS_ID: witness-3
      WITNESS_PORT: 4203
      BESU_RPC_URL: http://besu3:8545
      WITNESS_KEY_PATH: /app/.local/witness-keys/witness-3.json
      WITNESS_PUBLIC_PATH: /app/.local/witness-public/witness-3.json
    ports: ["127.0.0.1:4203:4203"]
    volumes: ["../../.local:/app/.local"]
    networks: [ledger]
    depends_on: { besu3: { condition: service_healthy } }
    healthcheck: *witness-health
    restart: unless-stopped

  witness4:
    build:
      context: ../..
      dockerfile: infra/compose/witness.Dockerfile
    environment:
      WITNESS_ID: witness-4
      WITNESS_PORT: 4204
      BESU_RPC_URL: http://besu4:8545
      WITNESS_KEY_PATH: /app/.local/witness-keys/witness-4.json
      WITNESS_PUBLIC_PATH: /app/.local/witness-public/witness-4.json
    ports: ["127.0.0.1:4204:4204"]
    volumes: ["../../.local:/app/.local"]
    networks: [ledger]
    depends_on: { besu4: { condition: service_healthy } }
    healthcheck: *witness-health
    restart: unless-stopped

volumes:
  postgres-data:
  besu1-data:
  besu2-data:
  besu3-data:
  besu4-data:

networks:
  ledger:
    ipam:
      config:
        - subnet: 10.203.0.0/24
