# Local persistent IdP: existing host networking, loopback listeners, no bridge or port publishing.
x-server-oidc: &server-oidc
  network_mode: host
  networks: !reset []
  restart: 'no'
  environment: &server-environment
    KC_DB_URL: jdbc:postgresql://127.0.0.1:54329/callsign_oidc
    KC_HTTP_HOST: 127.0.0.1
    KC_HTTP_PORT: '38080'
    KC_HTTP_MANAGEMENT_HOST: 127.0.0.1
    KC_HTTP_MANAGEMENT_PORT: '39000'
    KC_HEALTH_ENABLED: 'true'
    JAVA_OPTS_APPEND: '-Xms64m -Xmx512m'
services:
  oidc-db:
    network_mode: host
    networks: !reset []
    restart: 'no'
    command: [postgres, -c, listen_addresses=127.0.0.1, -p, '54329']
    healthcheck: {test: [CMD, pg_isready, -h, 127.0.0.1, -p, '54329', -U, callsign_oidc, -d, callsign_oidc], interval: 5s, timeout: 3s, retries: 12}
  oidc:
    <<: *server-oidc
    networks: !reset []
  oidc-init:
    <<: *server-oidc
    networks: !reset []
    volumes:
      - type: bind
        source: ${KEYCLOAK_REALM_IMPORT_FILE:?protected one-time NEW realm input}
        target: /provision/callsign-demo-realm.json
        read_only: true
        bind: {create_host_path: false}
networks: !reset {}
