map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 256k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy 'camera=(), microphone=(self)' always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location /health { access_log off; return 200 'alive'; }
  location /api/ {
    proxy_pass http://platform:4100/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_buffering off;
    access_log off;
  }
  location / { try_files $uri $uri/ /index.html; }
}
