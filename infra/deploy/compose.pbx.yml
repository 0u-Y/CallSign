# Merge with compose.yml. Asterisk terminates DTLS-SRTP and mixes media; no external Edge service.
services:
  asterisk:
    labels:
      org.callsign.lifecycle: persistent
      org.callsign.deployment-id: ${DEPLOYMENT_ID:?immutable deployment identity}
    image: ${ASTERISK_IMAGE:?reviewed Asterisk 22 image digest with SHA-256 digest auth and ODBC modules}
    profiles: [pbx]
    restart: unless-stopped
    init: true
    user: '1000:1000'
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /var/run/asterisk:uid=1000,gid=1000
      - /var/log/asterisk:uid=1000,gid=1000
      - /var/spool/asterisk:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${FINALS_DATA_DIR}/asterisk:/etc/asterisk:ro
      - ${FINALS_DATA_DIR}/asterisk/odbc.ini:/etc/odbc.ini:ro
    networks:
      application: {}
      public:
        ipv4_address: ${PBX_PRIVATE_ADDRESS:-10.205.0.20}
        gw_priority: 1
    ports: ['10000-10099:10000-10099/udp']
    healthcheck:
      test: [CMD, asterisk, -rx, 'core show uptime']
      interval: 10s
      timeout: 3s
      retries: 3
    # Keep image XML documentation visible; call authority and realtime SIP state live in PostgreSQL.
    # ARI and WSS remain internal; browser WSS is proxied through the same HTTPS origin.
