services:
  asterisk:
    image: ${ASTERISK_IMAGE:?pin independently reviewed Asterisk image digest}
    profiles: [pbx]
    restart: unless-stopped
    volumes: ['${FINALS_DATA_DIR}/asterisk:/etc/asterisk:ro', 'asterisk-data:/var/lib/asterisk']
    networks: [application]
    # Private SIP/ARI only; no unauthenticated trunk exposure.
  media-edge:
    image: ${MEDIA_EDGE_IMAGE:?implementation and image still required}
    profiles: [pbx]
    restart: unless-stopped
    volumes: ['${FINALS_DATA_DIR}/media-edge:/config:ro']
    networks: [application, public]
    # The third-party media bridge is explicitly not fabricated by this repository.
