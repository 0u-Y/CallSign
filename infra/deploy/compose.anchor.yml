# Separate AWS host/storage/credential lifetime. Never included in the application backup.
name: ${CALLSIGN_ANCHOR_PROJECT:?unique anchor project}
services:
  anchor-db:
    image: ${POSTGRES_IMAGE:?reviewed postgres 17.6 image}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: callsign_anchor
      POSTGRES_USER: anchor_owner
      POSTGRES_PASSWORD: ${ANCHOR_OWNER_PASSWORD:?separate protected credential}
    volumes:
      - {type: bind, source: '${ANCHOR_VOLUME_ROOT:?separate EBS path}/postgres', target: /var/lib/postgresql/data, bind: {create_host_path: false}}
    networks: [anchor]
    mem_limit: 512m
    memswap_limit: 512m
    logging: &log {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U anchor_owner -d callsign_anchor']
      interval: 5s
      timeout: 3s
      retries: 15
  anchor:
    image: ${CALLSIGN_APP_IMAGE:?runtime including remote TLS anchor support}
    platform: linux/amd64
    command: [pnpm, anchor]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      CALLSIGN_ALLOW_EXTERNAL_EXECUTION: infrastructure
      ANCHOR_HOST: 0.0.0.0
      ANCHOR_DATABASE_URL: ${ANCHOR_DATABASE_URL:?non-owner SELECT/UPDATE login}
      ANCHOR_TOKEN: ${ANCHOR_TOKEN:?separate bearer credential}
      ANCHOR_TLS_KEY_PATH: /tls/key.pem
      ANCHOR_TLS_CERT_PATH: /tls/cert.pem
      PORT: '4300'
    volumes:
      - {type: bind, source: '${ANCHOR_TLS_DIR:?anchor-only certificate directory}', target: /tls, read_only: true, bind: {create_host_path: false}}
    ports: ['443:4300']
    networks: [anchor, ingress]
    mem_limit: 256m
    memswap_limit: 256m
    logging: *log
    depends_on: {anchor-db: {condition: service_healthy}}
networks:
  anchor: {internal: true}
  ingress: {}
