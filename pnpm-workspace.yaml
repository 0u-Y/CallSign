packages:
  - apps/*
  - services/*
  - packages/*
  - tooling/*
allowBuilds:
  # Vite/Vitest require esbuild's platform binary link step. No other package
  # install scripts are approved by this workspace.
  esbuild: true
minimumReleaseAgeExclude:
  - zod@4.6.5

# Never install or run dependency lifecycle scripts implicitly from light/exec/run.
verifyDepsBeforeRun: error
