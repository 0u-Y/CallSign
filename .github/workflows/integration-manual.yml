name: explicit-infrastructure-validation
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type RUN-INTEGRATION after separate approval to start PostgreSQL'
        required: true
jobs:
  integration:
    if: inputs.authorization == 'RUN-INTEGRATION'
    environment: infrastructure-validation
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: institutionproof
          POSTGRES_USER: institutionproof
          POSTGRES_PASSWORD: ci_ephemeral_only
        ports: ['55432:5432']
        options: >-
          --health-cmd 'pg_isready -U institutionproof'
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CALLSIGN_ALLOW_EXTERNAL_EXECUTION: integration
      SKIP_DB_START: '1'
      DATABASE_URL: postgres://institutionproof:ci_ephemeral_only@localhost:55432/institutionproof
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:integration
